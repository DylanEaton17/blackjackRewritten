<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afternoon - Blackjack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #87ceeb 0%, #4682b4 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(30, 60, 90, 0.9);
            border: 3px solid #4169e1;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            text-align: center;
            color: #ffd700;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .shops-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .shop-card {
            background: rgba(50, 80, 110, 0.8);
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #4169e1;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .shop-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(65, 105, 225, 0.5);
            border-color: #ffd700;
        }
        
        .shop-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .shop-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .shop-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        .shop-desc {
            font-size: 0.9em;
            color: #ccc;
        }
        
        .casino-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #dc143c 0%, #8b0000 100%);
            color: #ffd700;
            border: 3px solid #ffd700;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 30px;
        }
        
        .casino-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(220, 20, 60, 0.6);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Afternoon</h1>
        
        <div id="content" class="loading">
            Loading...
        </div>
    </div>

    <script>
        async function loadAfternoonData() {
            try {
                const response = await fetch('/api/story/afternoon');
                const data = await response.json();
                
                if (data.success) {
                    displayAfternoon(data);
                } else {
                    document.getElementById('content').innerHTML = '<p>Error loading afternoon data.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = '<p>Error loading afternoon data.</p>';
            }
        }
        
        function displayAfternoon(data) {
            const content = document.getElementById('content');
            
            let html = '<div class="shops-grid">';
            
            // Shop icons mapping
            const shopIcons = {
                'doctor': '🏥',
                'witch': '🔮',
                'tom': '🔧',
                'frank': '⚙️',
                'oswald': '🚗',
                'marvin': '🏪'
            };
            
            const shopDescriptions = {
                'doctor': 'Health treatments',
                'witch': 'Potions & magic',
                'tom': 'Item repairs',
                'frank': 'Fix-it services',
                'oswald': 'Auto shop',
                'marvin': 'General store'
            };
            
            if (data.shops && data.shops.length > 0) {
                data.shops.forEach(shop => {
                    const shopKey = shop.id || shop.name.toLowerCase();
                    const isLocked = shop.locked || false;
                    const lockClass = isLocked ? ' locked' : '';
                    
                    html += `
                        <div class="shop-card${lockClass}" onclick="${isLocked ? '' : `visitShop('${shopKey}')`}">
                            <div class="shop-icon">${shopIcons[shopKey] || '🏪'}</div>
                            <div class="shop-name">${shop.name}</div>
                            <div class="shop-desc">${shopDescriptions[shopKey] || shop.description || ''}</div>
                            ${isLocked ? '<div style="margin-top: 10px; color: #ff6b6b;">🔒 Locked</div>' : ''}
                        </div>
                    `;
                });
            } else {
                // Default shops
                const defaultShops = ['doctor', 'witch', 'tom', 'frank', 'oswald', 'marvin'];
                defaultShops.forEach(shopKey => {
                    html += `
                        <div class="shop-card" onclick="visitShop('${shopKey}')">
                            <div class="shop-icon">${shopIcons[shopKey]}</div>
                            <div class="shop-name">${shopKey.charAt(0).toUpperCase() + shopKey.slice(1)}</div>
                            <div class="shop-desc">${shopDescriptions[shopKey]}</div>
                        </div>
                    `;
                });
            }
            
            html += '</div>';
            
            html += `
                <button class="casino-btn" onclick="goToCasino()">
                    🎰 Enter Casino (Tonight) 🎰
                </button>
            `;
            
            content.innerHTML = html;
        }
        
        function visitShop(shopId) {
            // For now, alert - will be replaced with actual shop UI
            alert(`Shop feature coming soon! (${shopId})`);
        }
        
        function goToCasino() {
            window.location.href = '/casino';
        }
        
        // Load data on page load
        loadAfternoonData();
    </script>
</body>
</html>
