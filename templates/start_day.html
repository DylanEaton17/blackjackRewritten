<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start of Day - Blackjack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #f5deb3 0%, #d2b48c 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #8b4513;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #8b4513;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .event-box {
            background: rgba(245, 222, 179, 0.5);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #d2b48c;
            margin: 20px 0;
            line-height: 1.8;
            font-size: 1.1em;
        }
        
        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        
        .choice-btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        
        .choice-btn:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(139, 69, 19, 0.4);
        }
        
        .continue-btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #228b22 0%, #32cd32 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 139, 34, 0.4);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #8b4513;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ Morning</h1>
        
        <div id="content" class="loading">
            Loading...
        </div>
    </div>

    <script>
        async function loadStartDayData() {
            try {
                const response = await fetch('/api/story/start-day');
                const data = await response.json();
                
                if (data.success) {
                    displayStartDay(data);
                } else {
                    document.getElementById('content').innerHTML = '<p>Error loading start of day data.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = '<p>Error loading start of day data.</p>';
            }
        }
        
        function displayStartDay(data) {
            const content = document.getElementById('content');
            
            let html = `
                <div class="event-box">
                    ${data.message || 'A new day begins...'}
                </div>
            `;
            
            if (data.event) {
                html += `
                    <div class="event-box" style="border-color: #ff8c00;">
                        <strong>Event:</strong><br>
                        ${data.event.description || data.event.message || ''}
                    </div>
                `;
                
                if (data.event.choices && data.event.choices.length > 0) {
                    html += '<div class="choices">';
                    data.event.choices.forEach((choice, index) => {
                        html += `
                            <button class="choice-btn" onclick="makeChoice('${choice.id || index}')">
                                ${choice.text || choice}
                            </button>
                        `;
                    });
                    html += '</div>';
                } else {
                    html += `
                        <button class="continue-btn" onclick="continueToAfternoon()">
                            Continue to Afternoon →
                        </button>
                    `;
                }
            } else {
                html += `
                    <button class="continue-btn" onclick="continueToAfternoon()">
                        Continue to Afternoon →
                    </button>
                `;
            }
            
            content.innerHTML = html;
        }
        
        async function makeChoice(choiceId) {
            try {
                const response = await fetch('/api/story/event-choice', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ choice: choiceId })
                });
                
                const data = await response.json();
                
                if (data.continue_to_afternoon) {
                    continueToAfternoon();
                } else {
                    // Reload to show result
                    loadStartDayData();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function continueToAfternoon() {
            window.location.href = '/afternoon';
        }
        
        // Load data on page load
        loadStartDayData();
    </script>
</body>
</html>
