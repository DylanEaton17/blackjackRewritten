<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Journey - Blackjack Story</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/story.css') }}">
</head>
<body>
    <div class="story-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="player-info">
                <div class="info-item">
                    <span class="label">Balance:</span>
                    <span class="value" id="balance">$50</span>
                </div>
                <div class="info-item">
                    <span class="label">Day:</span>
                    <span class="value" id="day">1</span>
                </div>
                <div class="info-item">
                    <span class="label">Time:</span>
                    <span class="value" id="time-of-day">Morning</span>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Inventory Panel (Left Side) -->
            <div class="side-panel inventory-panel">
                <h3>Inventory</h3>
                <div id="inventory-list" class="inventory-list">
                    <div class="empty-message">No items yet</div>
                </div>
            </div>

            <!-- Center Story/Event Area -->
            <div class="center-panel">
                <div class="story-display" id="story-display">
                    <h2 id="location-title">Outside the Casino</h2>
                    <div class="story-text" id="event-text">
                        <p>You're standing in the parking lot, looking at the casino entrance.</p>
                        <p>The desert heat makes you squint as you consider your next move.</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-area">
                    <button class="btn btn-casino" id="enter-casino-btn">
                        🎰 Enter Casino
                    </button>
                    <button class="btn btn-explore" id="explore-btn">
                        🚶 Explore Area
                    </button>
                    <button class="btn btn-rest" id="rest-btn">
                        💤 Rest
                    </button>
                </div>
            </div>

            <!-- Status Panel (Right Side) -->
            <div class="side-panel status-panel">
                <h3>Status</h3>
                <div class="status-list" id="status-list">
                    <div class="status-item">
                        <span class="status-label">Health:</span>
                        <div class="health-bar">
                            <div class="health-fill" id="health-fill" style="width: 100%"></div>
                        </div>
                        <span class="status-value" id="health-value">100/100</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Condition:</span>
                        <span class="status-value status-good" id="condition">Healthy</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/story.js') }}"></script>
</body>
</html>
